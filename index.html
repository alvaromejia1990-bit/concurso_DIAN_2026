function seededShuffle(arr, seed){ let s = seed>>>0 || 1; const a = arr.slice(); for(let i=a.length-1;i>0;i--){ s = (s*1664525+1013904223)>>>0; const j = s % (i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }

const S = { bank:null, byId:{}, names:null, store:null, docs:{}, view:"home", cur:null, sample:null, genAbort:null, aiAbort:null };

/* ---------- storage ---------- */
async function initStore(){
  let db=null, uid=null;
  try{
    if (window.claude && claude.use){
      const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (d && u){ uid = await u.id(); if (uid) db = d; }
    }
  }catch(e){ db=null; }
  const pending = {}, inflight = {};
  let raw, kind;
  if (db){
    const col = db.collection("data/users/" + uid);
    kind = "cuenta";
    raw = {
      async list(){ const snap = await col.get(); const out={}; snap.docs.forEach(d=>{ if(d.exists) out[d.id]=JSON.parse(JSON.stringify(d.data())); }); return out; },
      async put(id,data){ await col.doc(id).set(data); },
      async del(id){ await col.doc(id).delete(); }
    };
  } else {
    const KEY = "dian2676-sim-v1"; kind = "navegador";
    const read = () => { try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; } };
    const write = o => { try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} };
    raw = { async list(){ return read(); }, async put(id,data){ const o=read(); o[id]=data; write(o); }, async del(id){ const o=read(); delete o[id]; write(o); } };
  }
  async function flush(id){
    if (inflight[id]) return; inflight[id] = true;
    try{
      while (pending[id]){
        const data = pending[id]; pending[id] = null;
        try{ await raw.put(id, data); }
        catch(e){
          if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 800+Math.random()*800)); pending[id] = pending[id] || data; continue; }
          if (e && e.code === "quota_exceeded") toast("No hay espacio para guardar más intentos. Borra intentos antiguos en el historial.");
          else toast("No se pudo guardar el último cambio.");
        }
      }
    } finally { inflight[id] = false; }
  }
  return { kind, list: raw.list, save(id, data){ pending[id] = JSON.parse(JSON.stringify(data)); flush(id); }, async del(id){ delete pending[id]; await raw.del(id); } };
}

/* ---------- items & attempts ---------- */
const item = id => S.byId[id];
const keyIdx = it => LET.indexOf(it.key);
const compName = c => (S.names.fb[c] || S.names.f[c] || S.names.comp[c] || S.names.int[c] || c);
const blockOfCode = c => S.names.fb[c] ? "fb" : S.names.f[c] ? "f" : S.names.comp[c] ? "comp" : "int";
function simItems(n){ const ord={fb:0,f:1,comp:2,int:3}; return S.bank.items.filter(i=>i.sim===n).sort((a,b)=>ord[a.block]-ord[b.block] || a.id.localeCompare(b.id)).map(i=>i.id); }
const isV2 = a => a && a.bv===BV;
function allAttempts(){ return Object.entries(S.docs).filter(([k,v])=>v && v.kind==="attempt").map(([k,v])=>Object.assign({_id:k},v)).sort((a,b)=>a.startedAt-b.startedAt); }
const attempts = () => allAttempts().filter(isV2);
const finished = sim => attempts().filter(a=>a.sim===sim && a.status==="finalizado");
const latestFinished = sim => finished(sim).pop();
const inProgress = sim => attempts().filter(a=>a.sim===sim && a.status==="en_curso").pop();
function bestTotal(sim){ let b=null; finished(sim).forEach(a=>{ const t=(a.summary||score(a)).sTotal; if (b==null||t>b) b=t; }); return b; }
const s4Unlocked = () => [1,2,3].every(n => { const b=bestTotal(n); return b!=null && trunc2(b) > UNLOCK; });
const s4Cfg = () => (S.docs.s4 && S.docs.s4.bv===BV) ? S.docs.s4 : null;
function registerGen(list){ (list||[]).forEach(g=>{ S.byId[g.id]=g; }); }
const permOf = (att, id) => (att.perms && att.perms[id]) || [0,1,2];

/* ---------- scoring ---------- */
function score(att){
  const r = {blocks:{}, byCode:{}, answered:0, total:att.items.length, correct:0};
  BLOCKS.forEach(b=>r.blocks[b.k]={c:0,n:0,omit:0,time:0});
  for (const id of att.items){
    const it = item(id); if(!it) continue;
    const ans = att.answers[id]; const ok = ans===keyIdx(it);
    if (ans!=null) r.answered++; if (ok) r.correct++;
    const B = r.blocks[it.block]; B.n++; if (ok) B.c++; if (ans==null) B.omit++; B.time += (att.times && att.times[id]) || 0;
    const C = r.byCode[it.code] = r.byCode[it.code] || {c:0,n:0,block:it.block}; C.n++; if (ok) C.c++;
  }
  const p = b => r.blocks[b].n ? r.blocks[b].c/r.blocks[b].n*100 : null;
  r.sFB = p("fb"); r.sF = p("f"); r.sComp = p("comp"); r.sInt = p("int");
  const fn = r.blocks.fb.n + r.blocks.f.n;
  r.sFunc = fn ? (r.blocks.fb.c + r.blocks.f.c)/fn*100 : null;
  r.sTotal = r.total ? r.correct/r.total*100 : null;
  r.pass = r.sFunc!=null && trunc2(r.sFunc) >= 70;
  const w = WEIGHTS[(S.docs.perfil && S.docs.perfil.modalidad) || "ingreso"];
  r.weighted = (r.sFunc||0)*w.f/100 + (r.sComp||0)*w.comp/100 + (r.sInt||0)*w.int/100;
  r.weightMax = w.f + w.comp + w.int;
  return r;
}
function summaryOf(att){ const r = score(att); return {sTotal:r.sTotal, sFunc:r.sFunc, sFB:r.sFB, sF:r.sF, sComp:r.sComp, sInt:r.sInt, pass:r.pass, answered:r.answered}; }
const band = p => p>=85 ? {k:"fort",t:"Fortaleza",c:"ok",col:"var(--ok)"} : p>=70 ? {k:"adec",t:"Adecuado",c:"pjs",col:"var(--pjs)"} : p>=50 ? {k:"ref",t:"Por reforzar",c:"warn",col:"var(--warn)"} : {k:"crit",t:"Crítico",c:"bad",col:"var(--bad)"};

/* ---------- profile across simulacros ---------- */
function profile(){
  const codeAgg = {}, wrong = new Set(), seen = new Set(), used = [];
  for (const sim of [1,2,3,4]){
    const a = latestFinished(sim); if(!a) continue; registerGen(a.gen); used.push(a);
    const r = score(a);
    for (const [c,v] of Object.entries(r.byCode)){ const A = codeAgg[c]=codeAgg[c]||{c:0,n:0,block:v.block}; A.c+=v.c; A.n+=v.n; }
    for (const id of a.items){ const it=item(id); if(!it) continue; seen.add(id); if (a.answers[id]!==keyIdx(it)) wrong.add(id); }
  }
  return {codeAgg, wrong, seen, used};
}
const errRate = a => a && a.n ? 1 - a.c/a.n : null;

/* ---------- simulacro 4 ---------- */
function allocate(total, entries){
  const out = {}; entries.forEach(e=>out[e.code]=Math.min(e.min||0, e.cap));
  let left = total - Object.values(out).reduce((a,b)=>a+b,0);
  for (let g=0; left>0 && g<20; g++){
    const open = entries.filter(e=>out[e.code]<e.cap); if(!open.length) break;
    const W = open.reduce((s,e)=>s+e.w,0) || open.length;
    const shares = open.map(e=>({e, x:left*(W? e.w/W : 1/open.length)}));
    let given = 0;
    shares.forEach(s=>{ const add = Math.min(Math.floor(s.x), s.e.cap-out[s.e.code]); out[s.e.code]+=add; given+=add; });
    left -= given;
    if (left>0 && given===0){ shares.sort((a,b)=>(b.x%1)-(a.x%1) || b.e.w-a.e.w); for (const s of shares){ if(left<=0) break; if(out[s.e.code]<s.e.cap){ out[s.e.code]++; left--; } } }
  }
  return out;
}
function buildS4(){
  const P = profile();
  const items = [], perms = {}, basis = {};
  const slow = new Set();
  P.used.forEach(a=>{ const t=a.times||{}; const vals=Object.values(t).filter(x=>x>0).sort((x,y)=>x-y); const p75 = vals[Math.floor(vals.length*.75)]||0; a.items.forEach(id=>{ if ((t[id]||0) > p75 || (a.flags||[]).includes(id)) slow.add(id); }); });
  const pool = code => S.bank.items.filter(i=>i.code===code);
  const prio = id => P.wrong.has(id) ? 0 : slow.has(id) ? 1 : !P.seen.has(id) ? 2 : 3;
  for (const b of BLOCKS){
    const codes = Object.keys(S.names[b.k]);
    const ent = codes.map(c=>{ const er = errRate(P.codeAgg[c]); basis[c]=er; return {code:c, w:(er==null?0.3:er)+0.04, cap:pool(c).length, min:Math.min(2,pool(c).length)}; });
    const cnt = allocate(PER_BLOCK, ent);
    const start = items.length;
    for (const c of codes){
      pool(c).map(i=>i.id).sort((x,y)=>prio(x)-prio(y) || (hash(x+"s4")%97)-(hash(y+"s4")%97)).slice(0, cnt[c]).forEach(id=>items.push(id));
    }
    const tail = seededShuffle(items.slice(start), hash(b.k+Date.now())); items.splice(start, tail.length, ...tail);
  }
  items.forEach(id=>{ perms[id] = seededShuffle([0,1,2], hash(id+Date.now())); });
  return {kind:"s4", bv:BV, createdAt:Date.now(), items, perms, gen:[], basis, wrongCount:P.wrong.size, basedOn:P.used.map(a=>a.sim)};
}

/* ---------- attempts lifecycle ---------- */
function newAttempt(sim, reg){
  const id = "att-" + rid();
  const base = {kind:"attempt", bv:BV, sim, status:"en_curso", startedAt:Date.now(), updatedAt:Date.now(), elapsed:0, idx:0, answers:{}, flags:[], times:{}, items:[], perms:{},
    registro:{nombre:reg.nombre, tipoDoc:reg.tipoDoc, doc:reg.doc, nbc:reg.nbc, modalidad:reg.modalidad, ciudad:reg.ciudad}};
  if (sim===4){ const c = s4Cfg(); base.items = c.items.slice(); base.perms = JSON.parse(JSON.stringify(c.perms)); base.gen = JSON.parse(JSON.stringify(c.gen||[])); }
  else { base.items = simItems(sim); base.items.forEach(i=>{ base.perms[i] = seededShuffle([0,1,2], hash(i+id)); }); }
  S.docs[id] = base; saveDoc(id); return id;
}
function startSim(sim){
  const run = inProgress(sim); if (run) return openExam(run._id);
  if (sim===4 && (!s4Unlocked() || !s4Cfg())) return;
  openRegistration(sim, reg => { openExam(newAttempt(sim, reg)); window.scrollTo(0,0); });
}
function openExam(id){
  const a = S.docs[id]; registerGen(a.gen); a.times = a.times || {};
  S.cur = {id, sessionStart:Date.now(), base:a.elapsed||0, sheetOpen:false, qStart:Date.now()};
  S.view = "exam"; render();
}
const elapsedNow = () => S.cur ? S.cur.base + (Date.now()-S.cur.sessionStart)/1000 : 0;
function commitQ(){ const c=S.cur; if(!c) return; const a=S.docs[c.id]; const id=a.items[a.idx]; const d=(Date.now()-c.qStart)/1000; if (d>0 && d<3600) a.times[id]=Math.round(((a.times[id]||0)+d)*10)/10; c.qStart=Date.now(); }
function persistElapsed(){ const c=S.cur; if(!c) return; const a=S.docs[c.id]; if(!a) return; a.elapsed = Math.round(elapsedNow()); c.base = a.elapsed; c.sessionStart = Date.now(); a.updatedAt = Date.now(); }
function finishAttempt(id, reason){
  const a = S.docs[id]; if(!a) return;
  if (S.cur && S.cur.id===id){ commitQ(); persistElapsed(); }
  a.status = "finalizado"; a.finishedAt = Date.now(); a.endReason = reason||"manual";
  a.summary = summaryOf(a);
  clearTimeout(saveTimer); saveDoc(id);
  S.cur = null; S.view = "results"; S.resId = id; S.resFilter = "wrong"; S.resLimit = 20; S.aiText = null; render(); window.scrollTo(0,0);
  if (a.sim<4 && s4Unlocked() && !s4Cfg()) toast("Habilitaste el simulacro 4. Puedes generarlo desde el inicio.");
}

function analyze(a){

  const prevSame = finished(a.sim).filter(x=>x._id!==a._id && x.finishedAt < a.finishedAt).pop();
  const prevAny = attempts().filter(x=>x.status==="finalizado" && x._id!==a._id && x.finishedAt < a.finishedAt).pop();
  const prev = prevSame || prevAny;
  let prevR = null; if (prev){ registerGen(prev.gen); prevR = score(prev); }
  comps.forEach(x=>{ if (prevR && prevR.byCode[x.c]) x.delta = x.p - prevR.byCode[x.c].c/prevR.byCode[x.c].n*100; });
  /* patterns */
  const ord = a.items.map((id,i)=>({id,i,it:item(id)})).filter(x=>x.it);
  const okOf = x => a.answers[x.id]===keyIdx(x.it);
  const half = Math.floor(ord.length/2);
  const acc = list => { const ans = list.filter(x=>a.answers[x.id]!=null); return list.length? list.filter(okOf).length/list.length*100 : null; };

}

function reviewItem(a, x){
  const it = x.it, ans = a.answers[x.id], perm = permOf(a, x.id), k = keyIdx(it), ok = ans===k;
  const t = (a.times||{})[x.id];
  return `<article class="sheet ritem">
    <div class="qmeta"><span class="mono" style="font-weight:600">${x.i+1}</span><span class="pill ${ok?"ok":ans==null?"neutral":"bad"}">${ok?"Correcta":ans==null?"Sin responder":"Incorrecta"}</span><span class="pill neutral">${esc(it.comp)}${it.block==="comp"?" · nivel "+LEVEL[it.code]:""}</span>${(a.flags||[]).includes(x.id)?`<span class="pill warn">Dudosa</span>`:""}${it.gen?`<span class="pill warn">Generada por Claude</span>`:""}${t?`<span class="small muted mono">${secs(t)}</span>`:""}</div>
    <div class="caso"><span class="eyebrow">Caso</span>${esc(it.caso)}</div><p class="enun">${esc(it.enun)}</p>
    <div class="opts">${perm.map((o,pos)=>`<div class="opt ${it.block==="fb"||it.block==="f"?"pjsc":"likc"} ${o===k?"key":""} ${o===ans&&o!==k?"wrong":""}"><span class="bub ${o===ans?"on":""}">${LET[pos]}</span><span class="txt">${esc(it.opts[o])}<div class="just"><b>${o===k?"Es correcta.":"Es incorrecta."}</b> ${esc(it.just[o])}</div></span></div>`).join("")}</div>
  </article>`;
}

/* ---------- render & events ---------- */
function render(){
  const app = $("#app");
  if (S.view==="exam") app.innerHTML = renderExam();
  else if (S.view==="results") app.innerHTML = renderResults();
  else app.innerHTML = renderHome();
  $("#navHome").setAttribute("aria-current", S.view==="home");
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  const c = S.cur, a = c && S.docs[c.id];
  switch(act){
    case "start": return startSim(+b.dataset.sim);
    case "cont": openExam(b.dataset.id); window.scrollTo(0,0); return;
    case "res": S.view="results"; S.resId=b.dataset.id; S.resFilter="wrong"; S.resLimit=20; S.aiText=null; render(); window.scrollTo(0,0); return;
    case "home": S.view="home"; render(); window.scrollTo(0,0); return;
    case "reg": return openRegistration(0, ()=>{ render(); toast("Registro guardado"); });
    case "filt": S.resFilter=b.dataset.f; S.resLimit=20; render(); return;
    case "more": S.resLimit=(S.resLimit||20)+20; render(); return;
    case "gen4": return confirmGen4();
    case "claude4": return claudeCases();
    case "ai": return aiAnalysis();
    case "aistop": if (S.aiAbort) S.aiAbort.abort(); return;
    case "del": return confirmDelete(b.dataset.id);
    case "ans": { const id = a.items[a.idx]; const v = +b.dataset.v; if (a.answers[id]===v) delete a.answers[id]; else a.answers[id]=v; commitQ(); persistElapsed(); saveSoon(c.id); render(); return; }
    case "jump": commitQ(); a.idx = +b.dataset.i; c.sheetOpen=false; persistElapsed(); saveSoon(c.id); render(); window.scrollTo({top:0}); return;
    case "prev": if (a.idx>0){ commitQ(); a.idx--; render(); window.scrollTo({top:0}); } return;
    case "next": if (a.idx < a.items.length-1){ commitQ(); a.idx++; persistElapsed(); saveSoon(c.id); render(); window.scrollTo({top:0}); } else confirmFinish(); return;
    case "flag": { const id=a.items[a.idx]; a.flags=a.flags||[]; const k=a.flags.indexOf(id); if(k>=0) a.flags.splice(k,1); else a.flags.push(id); saveSoon(c.id); render(); return; }
    case "sheet": c.sheetOpen=!c.sheetOpen; render(); return;
    case "pause": commitQ(); persistElapsed(); clearTimeout(saveTimer); saveDoc(c.id); S.cur=null; S.view="home"; render(); toast("Avance guardado"); return;
    case "finish": return confirmFinish();
  }
});
$("#navHome").addEventListener("click", ()=>{ if (S.cur){ commitQ(); persistElapsed(); clearTimeout(saveTimer); saveDoc(S.cur.id); S.cur=null; } S.view="home"; render(); });
document.addEventListener("visibilitychange", ()=>{ if (!S.cur) return; if (document.hidden){ commitQ(); persistElapsed(); clearTimeout(saveTimer); saveDoc(S.cur.id); } else { S.cur.qStart = Date.now(); } });
setInterval(()=>{ if (S.view!=="exam" || !S.cur) return; const left = SESSION_SECONDS - elapsedNow(); const t=$("#timer"); if(t){ t.textContent=hms(left); t.style.color = left<900?"var(--bad)":""; } if (left<=0) finishAttempt(S.cur.id, "tiempo"); }, 1000);

function confirmFinish(){
  const a = S.docs[S.cur.id]; const miss = a.items.filter(id=>a.answers[id]==null).length;
  modal(`<h3>Finalizar el simulacro ${a.sim}</h3><p>${miss?`Tienes <b>${miss}</b> preguntas sin responder. Se califican como incorrectas.`:"Respondiste todas las preguntas."}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">Seguir respondiendo</button><button class="btn" data-m="yes">Finalizar y ver el análisis</button></div>`,
    (L,close)=>{ L.querySelector('[data-m="no"]').onclick=close; L.querySelector('[data-m="yes"]').onclick=()=>{ close(); finishAttempt(S.cur.id,"manual"); }; });
}
function confirmDelete(id){
  const a = S.docs[id];
  modal(`<h3>Borrar intento</h3><p>Se borrará el intento del simulacro ${a.sim} iniciado el ${esc(dt(a.startedAt))}, con sus respuestas. No se puede deshacer.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">Cancelar</button><button class="btn danger" data-m="yes">Borrar</button></div>`,
    (L,close)=>{ L.querySelector('[data-m="no"]').onclick=close; L.querySelector('[data-m="yes"]').onclick=async()=>{ close(); delete S.docs[id]; try{ await S.store.del(id); toast("Intento borrado"); }catch(e){ toast("No se pudo borrar"); } render(); }; });
}
function confirmGen4(){
  if (!s4Unlocked()) return;
  const go = () => { S.docs.s4 = buildS4(); saveDoc("s4"); render(); toast("Simulacro 4 generado"); };
  if (!s4Cfg()) return go();
  modal(`<h3>Regenerar el simulacro 4</h3><p>Se armará de nuevo con tus resultados más recientes. Los casos inéditos agregados con Claude se descartan. Tus intentos anteriores se conservan.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">Cancelar</button><button class="btn lik" data-m="yes">Regenerar</button></div>`,
    (L,close)=>{ L.querySelector('[data-m="no"]').onclick=close; L.querySelector('[data-m="yes"]').onclick=()=>{ close(); go(); }; });
}
const AI_ERR = {not_granted:"No se autorizó el uso de Claude en esta página.", rate_limited:"Claude está ocupado o alcanzaste tu límite de uso. Intenta más tarde.", invalid_json:"La respuesta llegó incompleta. Intenta de nuevo.", sampling_disabled:"Claude no está disponible para esta cuenta."};

async function aiAnalysis(){
  const a = Object.assign({_id:S.resId}, S.docs[S.resId]); const A = analyze(a); const r = A.r;
  const wrongs = a.items.map(id=>item(id)).filter(it=>it && a.answers[it.id]!==keyIdx(it)).slice(0,25)
    .map(it=>`- [${compName(it.code)}] ${it.enun} → eligió: "${a.answers[it.id]==null?"(sin responder)":it.opts[a.answers[it.id]]}"; correcta: "${it.opts[keyIdx(it)]}"`).join("\n");
  const prompt = `Eres tutor de aspirantes al Proceso de Selección DIAN 2676 (empleo Gestor II, código 302, grado 02; proceso de cumplimiento de obligaciones tributarias, subproceso de administración de cartera, recaudo y devoluciones).
Analiza el resultado de un simulacro y escribe en español, sin markdown ni viñetas con asteriscos, en párrafos cortos y numerales simples:
1. Un diagnóstico cualitativo de 4 a 6 frases: qué tipo de errores comete (por ejemplo confusión de términos, de competencia de autoridades, de nivel de la conducta esperada), con ejemplos tomados de sus errores.
2. Tres fortalezas concretas.
3. Un plan de estudio de 7 días, un día por línea, con temas y normas específicas a repasar.
4. Dos consejos de estrategia para el día de la prueba.

Datos:
Total ${fmt(r.sTotal)}; funcionales ${fmt(r.sFunc)} (básicas ${fmt(r.sFB)}, del empleo ${fmt(r.sF)}); comportamentales ${fmt(r.sComp)}; integridad ${fmt(r.sInt)}.
Acierto por competencia: ${A.comps.map(x=>`${compName(x.c)} ${Math.round(x.p)}%`).join("; ")}.
Acierto primera mitad ${pct0(A.first)}, segunda mitad ${pct0(A.second)}; respuestas rápidas ${A.fast.length} con acierto ${pct0(A.fastAcc)}; dudosas ${A.flagged.length} con acierto ${pct0(A.fAcc)}.
Errores (máximo 25):
${wrongs||"(ninguno)"}`;
  S.aiAbort = new AbortController(); S.aiBusy = true; S.aiText = null; render();
  try{
    const res = await S.sample(prompt, {signal:S.aiAbort.signal, cache:false, onText:({text})=>{ S.aiText=text; const o=$("#aiOut"); if(o){ o.className="ai"; o.textContent=text; } }});
    S.aiText = res.text;
  }catch(e){
    if (e && e.code!=="cancelled"){ S.aiText = (e.text?e.text+"\n\n":"") + (AI_ERR[e.code] || "No se pudo completar el análisis. Intenta de nuevo."); if (e.code==="not_granted"||e.code==="sampling_disabled") S.sample=null; }
    else S.aiText = e && e.text || null;
  }
  S.aiBusy = false; if (S.view==="results") render();
}

function claudeCases(){
  const P = profile();
  const ranked = Object.entries(P.codeAgg).filter(([c])=>{ const b=blockOfCode(c); return b==="fb"||b==="f"; }).map(([c,v])=>({c, er:1-v.c/v.n})).sort((x,y)=>y.er-x.er).slice(0,3);
  if (!ranked.length) return;
  modal(`<h3>Casos inéditos con Claude</h3><p>Claude redactará 6 casos nuevos de juicio situacional, dos por cada una de tus competencias funcionales con más error: <b>${ranked.map(r=>esc(compName(r.c))).join(", ")}</b>. Reemplazarán preguntas que ya respondiste bien. Usa tu cuenta de Claude y puede tardar uno o dos minutos.</p><p class="small muted" id="genStatus"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">Cancelar</button><button class="btn lik" data-m="yes">Redactar casos</button></div>`,
  (L,close)=>{
    const st = L.querySelector("#genStatus");
    L.querySelector('[data-m="no"]').onclick=()=>{ if (S.genAbort) S.genAbort.abort(); close(); };
    L.querySelector('[data-m="yes"]').onclick=async(ev)=>{
      ev.target.disabled = true; st.textContent = "Claude está redactando los casos…";
      const errs = ranked.map(r=>{ const ex = [...P.wrong].map(item).filter(i=>i&&i.code===r.c).slice(0,2).map(i=>`- ${i.enun}`).join("\n"); return `${r.c} (${compName(r.c)}), error ${Math.round(r.er*100)} %. Enunciados fallados:\n${ex||"- (sin ejemplos)"}`; }).join("\n\n");
      const prompt = `Eres constructor de ítems del Proceso de Selección DIAN 2676 (CNSC). Empleo: Gestor II, código 302, grado 02, nivel profesional. Proceso: cumplimiento de obligaciones tributarias. Subproceso: administración de cartera, recaudo y devoluciones.

Escribe 6 ítems nuevos de Prueba de Juicio Situacional, 2 por cada competencia indicada. Cada ítem:
- "caso": situación laboral hipotética de la DIAN, de 50 a 90 palabras, en tercera persona.
- "enun": la tarea, que termina con una frase como "al profesional le corresponde".
- "opts": tres opciones que completan el enunciado, en minúscula, de longitud similar entre sí (la correcta no debe ser la más larga), una sola correcta.
- "key": letra de la correcta ("A", "B" o "C"), variando la posición.
- "just": tres justificaciones en el mismo orden de las opciones, de 2 a 3 oraciones, citando la norma colombiana vigente a junio de 2026. No empieces con "Es correcta" o "Es incorrecta". Si no tienes certeza de un número de artículo, describe la regla sin número.
- "code": el código de la competencia.

Competencias y errores del aspirante:
${errs}

Responde solo con un arreglo JSON de 6 objetos {"code","caso","enun","opts","key","just"}.`;
      S.genAbort = new AbortController();
      try{
        const out = await S.sample.json(prompt, {signal:S.genAbort.signal, cache:false});
        const ok = (Array.isArray(out)?out:[]).filter(g=>g && ranked.some(r=>r.c===g.code) && Array.isArray(g.opts) && g.opts.length===3 && Array.isArray(g.just) && g.just.length===3 && "ABC".includes(String(g.key)) && g.caso && g.enun);
        if (!ok.length){ st.textContent = "La respuesta no tenía casos con el formato esperado. Intenta de nuevo."; ev.target.disabled=false; return; }
        const cfg = s4Cfg(); const P2 = profile(); let added = 0;
        ok.forEach((g,i)=>{
          const blk = blockOfCode(g.code); const gid = "G4-" + rid() + i;
          const gi = {id:gid, sim:4, block:blk, code:g.code, comp:compName(g.code), caso:String(g.caso), enun:String(g.enun), opts:g.opts.map(String), just:g.just.map(String), key:String(g.key), gen:true};
          const rem = cfg.items.find(id=>{ const it=item(id); return it && it.block===blk && !it.gen && !P2.wrong.has(id); }); if (!rem) return;
          cfg.items[cfg.items.indexOf(rem)] = gid; delete cfg.perms[rem]; cfg.perms[gid]=seededShuffle([0,1,2], hash(gid));
          cfg.gen = (cfg.gen||[]).concat([gi]); S.byId[gid]=gi; added++;
        });
        saveDoc("s4"); close(); render(); toast(`${added} casos inéditos añadidos al simulacro 4`);
      }catch(e){
        if (e && e.code==="cancelled") return;
        st.textContent = AI_ERR[e&&e.code] || "No se pudieron generar los casos. Intenta de nuevo.";
        ev.target.disabled = false;
        if (e && (e.code==="not_granted"||e.code==="sampling_disabled")) S.sample = null;
      }
    };
  });
}

/* ---------- boot ---------- */
async function boot(){
  try{ const res = await fetch("data/bank.json"); S.bank = await res.json(); }
  catch(e){ $("#app").innerHTML = `<div class="loading">No se pudo cargar el banco de preguntas. Recarga la página.</div>`; return; }
  S.names = S.bank.names; S.bank.items.forEach(i=>S.byId[i.id]=i);
  $("#app").innerHTML = `<div class="loading">Cargando tu historial…</div>`;
  S.store = await initStore();
  try{ S.docs = await S.store.list() || {}; }catch(e){ S.docs = {}; }
  Object.values(S.docs).forEach(d=>{ if(d && d.gen) registerGen(d.gen); });
  const chip = $("#storeChip");
  chip.textContent = S.store.kind==="cuenta" ? "Guardado en tu cuenta" : "Guardado en este navegador";
  chip.title = S.store.kind==="cuenta" ? "Tus intentos se guardan de forma privada y los ves desde cualquier dispositivo." : "Sin conexión a tu cuenta: los intentos quedan solo en este navegador.";
  render();
  try{ if (window.claude && claude.use){ const s = await claude.use("sample"); if (s){ S.sample = s; if (S.view!=="exam") render(); } } }catch(e){}
}
boot();
})();
</script>
